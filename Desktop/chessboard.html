<html>
<head>
<style>
table {
    border-collapse: collapse;
}
td {
    width: 60px;
    height: 60px;
}
.black {
    background-color: black;
}
.white {
    background-color: white;
}
</style>
</head>
<body>

<table border="1">
<script>
for(let i=0;i<8;i++) {
    document.write("<tr>");
    for(let j=0;j<8;j++) {
        if((i+j)%2==0)
            document.write("<td class='white'></td>");
        else
            document.write("<td class='black'></td>");
    }
    document.write("</tr>");
}
</script>
</table>

</body>
</html>
