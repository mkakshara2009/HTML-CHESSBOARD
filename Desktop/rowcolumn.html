<html>
<head>
    <title>HTML Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 90%;
            font-family: Arial;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            font-size: 20px;
            text-align: left;
        }

        th {
            font-weight: bold;
        }

        .yellow {
            background-color: yellow;
        }

        .blue {
            background-color: #00aaff;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Col Head1</th>
        <th>Col Head2</th>
        <th>Col Head3</th>
        <th>Col Head4</th>
        <th>Col Head5</th>
    </tr>

    <tr>
        <td>Row1 Cell1</td>
        <td class="yellow">Row1 Cell2</td>
        <td>Row1 Cell3</td>
        <td>Row1 Cell4</td>
        <td>Row1 Cell5</td>
    </tr>

    <tr>
        <td>Row2 Cell1</td>
        <td colspan="2">Row2 Cell2</td>
        <td>Row2 Cell3</td>
        <td rowspan="2" class="italic">Row2 Cell4</td>
    </tr>

    <tr>
        <td>Row3 Cell1</td>
        <td rowspan="2">Row1 Cell2</td>
        <td>Row3 Cell3</td>
        <td class="bold">Row3 Cell4</td>
    </tr>

    <tr>
        <td>Row4 Cell1</td>
        <td>Row4 Cell2</td>
        <td class="blue">Row4 Cell3</td>
        <td>Row4 Cell4</td>
    </tr>
</table>

</body>
</html>
